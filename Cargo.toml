[package]
name = "blog"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
pulldown-cmark = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-util = "0.7"
tower = "0.4"
walkdir = "2"
hyper-util = { version = "0.1", features = ["full"] }
tower-http = { version = "0.5", features = ["fs"] }
